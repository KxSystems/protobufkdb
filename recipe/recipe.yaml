context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-protobuf
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - make
  host:
    - libprotobuf
    - if: match(libprotobuf, ">=4")
      then: libabseil

about:
  homepage: https://github.com/KxSystems/protobufkdb
  repository: https://github.com/KxSystems/protobufkdb
  documentation: https://github.com/KxSystems/protobufkdb/blob/master/docs/reference.md
  license: Apache-2.0
  license_file: LICENSE
  summary: kdb-x APIs to parse Google Protocol Buffers data into kdb-x and serialise it back to the wire format.
  description: >-
    kdb-x APIs to parse data which has been encoded using Google Protocol
    Buffers (protobuf) into kdb-x according to the proto schema and serialise
    it back to the encoded wire format.

tests:
  - script:
    - if: unix
      then:
      - test -f ${PREFIX}/lib/q/mod/kx/protobuf/init.q
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/protobuf/clib.li64.so
    - if: linux and aarch64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/protobuf/clib.la64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/protobuf/clib.ma64.so
    - if: osx and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/protobuf/clib.mi64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\protobuf\\init.q exit 1
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\\protobuf\\clib.wi64.dll exit 1
